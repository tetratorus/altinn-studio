worker_processes 1;
events { worker_connections 1024; }

http {
  # Correlation: reuse an incoming traceparent / X-Request-ID if present, else mint one.
  map $http_x_request_id $lrr_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format lrr '$time_iso8601 host=$host req_id=$lrr_request_id traceparent="$http_traceparent" '
                 '$remote_addr "$request" $status $body_bytes_sent upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout lrr;
  error_log  /dev/stderr warn;

  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-ID $lrr_request_id;
  proxy_read_timeout 300s;
  proxy_buffering off;
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  # --- Platform: https://local.altinn.cloud ------------------------------------------------
  # The app lives on its own subdomain (app.local.altinn.cloud). Altinn.App treats a HostName of
  # local.altinn.cloud as "running against localtest" and would fetch service-owner tokens from a
  # localtest-only endpoint; on any other host it uses the production Maskinporten -> Authentication
  # token-exchange path, which is what this runtime exercises.
  server {
    listen 443 ssl;
    server_name local.altinn.cloud;
    ssl_certificate     /certs/local.altinn.cloud.crt;
    ssl_certificate_key /certs/local.altinn.cloud.key;
    add_header X-Request-ID $lrr_request_id always;

    location /storage/          { set $u http://storage:5010;           proxy_pass $u; }
    location /register/         { set $u http://register:5020;          proxy_pass $u; }
    location /profile/          { set $u http://profile:5030;           proxy_pass $u; }
    location /authentication/   { set $u http://authentication:5040;    proxy_pass $u; }
    location /authorization/    { set $u http://authorization:5050;     proxy_pass $u; }
    location /accessmanagement/ { set $u http://accessmanagement:5117;  proxy_pass $u; }
    location /events/           { set $u http://events:5080;            proxy_pass $u; }
    location /workflow-engine/  { set $u http://workflow-engine:9090/;  proxy_pass $u; }

    location /cdn/ { alias /static/; }

    location = / { return 302 https://app.local.altinn.cloud/ttd/frontend-test/; }
  }

  # --- The reporting application: https://app.local.altinn.cloud/ttd/frontend-test/ ------------
  server {
    listen 443 ssl;
    server_name app.local.altinn.cloud;
    ssl_certificate     /certs/local.altinn.cloud.crt;
    ssl_certificate_key /certs/local.altinn.cloud.key;
    add_header X-Request-ID $lrr_request_id always;

    location /ttd/frontend-test/ { set $u http://app:5005; proxy_pass $u; }
    location = / { return 302 /ttd/frontend-test/; }
  }

  # --- Local upstream identity provider substitute: https://mockporten.local.altinn.cloud ---
  server {
    listen 443 ssl;
    server_name mockporten.local.altinn.cloud;
    ssl_certificate     /certs/local.altinn.cloud.crt;
    ssl_certificate_key /certs/local.altinn.cloud.key;
    location / { set $u http://mockporten:5090; proxy_pass $u; }
  }

  # --- Local event subscriber (webhook receiver) ---------------------------------------------
  server {
    listen 443 ssl;
    server_name subscriber.local.altinn.cloud;
    ssl_certificate     /certs/local.altinn.cloud.crt;
    ssl_certificate_key /certs/local.altinn.cloud.key;
    location / { set $u http://subscriber:8085; proxy_pass $u; }
  }
}
